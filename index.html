<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip-chan</title>
  </head>
  <body>
    <main id="pip" aria-label="Pip-chan desktop companion">
      <div id="bubble" class="bubble" role="status" aria-live="polite" hidden>
        <span id="bubble-copy">Baka! I’m waiting.</span>
        <button id="dismiss" aria-label="Dismiss Pip-chan message">×</button>
      </div>
      <img id="pip-image" src="/src/assets/pip-idle.png" alt="Pip-chan" draggable="false" />
      <div id="hint">drag me</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
